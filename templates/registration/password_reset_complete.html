{% extends 'base.html' %}

{% block title %}Password Reset Complete - Smart Sorter{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card border-0 text-center"
        style="width: 100%; max-width: 440px; background: var(--secondary-bg); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); border: 1px solid var(--border-color);">
        <div class="card-body p-5">
            <div class="mb-4" style="color: var(--success-text); font-size: 3.5rem;">
                <i class="fas fa-check-circle"></i>
            </div>
            
            <h3 class="fw-bold mb-3" style="color: var(--text-main);">Reset Successful</h3>
            
            <p class="text-muted small mb-4" style="line-height: 1.6;">
                Your password has been successfully reset! You can now log in using your new credentials.
            </p>

            <div class="d-grid gap-2 pt-2">
                <a href="{% url 'login' %}" class="btn-primary-custom text-center" style="width:100%; justify-content:center; text-decoration:none;">
                    Log In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
